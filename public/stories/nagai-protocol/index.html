<!doctype html>
<html lang="en" data-theme="light" data-ui="braun" data-font="book" data-faces="auto" data-type-size="md" data-measure="narrow">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f2f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)">
<title>stories — ibm.io</title>
<meta name="description" content="A quiet ereader. Local stories, shared look with the ibm.io instrument suite.">
<link rel="canonical" href="https://ibm.io/stories/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="webFonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Serif:wght@400;500&family=Josefin+Sans:wght@400;500&family=Josefin+Slab:wght@400;500&family=Libre+Franklin:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Oswald:wght@400;500&family=Roboto+Slab:wght@400;500&family=Share+Tech+Mono&family=Source+Code+Pro:wght@400;500&family=Source+Sans+3:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=Space+Mono:wght@400;700&display=swap" media="print" onload="this.media='all'">

<link rel="stylesheet" href="/lib/number-tool.css?v=50">
<link rel="manifest" href="/manifest.webmanifest">
<style>
  /* Ereader needs scroll; number-tool locks the viewport. */
  html.stories-app,
  html.stories-app body.tool-app {
    overflow: auto !important;
    overflow-x: hidden !important;
    overflow-y: auto !important;
    height: auto !important;
    min-height: 100%;
    max-height: none !important;
    touch-action: pan-y !important;
  }
  html.stories-app body.tool-app {
    align-items: stretch;
    padding-right: max(var(--pad), env(safe-area-inset-right));
  }
  html.stories-app body.tool-app main {
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    flex: 1;
    min-height: 0;
    overflow: visible;
    justify-content: flex-start;
    pointer-events: auto !important;
  }
  /* Gesture shell disables main hits except .face/.stack — restore library/reader. */
  html.stories-app[data-gestures="1"] main,
  html.stories-app[data-gestures="1"] main * {
    pointer-events: auto !important;
  }

  /* Reading type follows chrome book face (set in JS). */
  html.stories-app {
    --type: Georgia, "Times New Roman", serif;
    --type-size: 1.125rem;
    --type-leading: 1.7;
    --measure: 38rem;
  }
  html[data-type-size="sm"] { --type-size: 1rem; --type-leading: 1.65; }
  html[data-type-size="md"] { --type-size: 1.125rem; --type-leading: 1.7; }
  html[data-type-size="lg"] { --type-size: 1.25rem; --type-leading: 1.75; }
  html[data-type-size="xl"] { --type-size: 1.375rem; --type-leading: 1.8; }
  html[data-measure="narrow"] { --measure: 34rem; }
  html[data-measure="medium"] { --measure: 38rem; }
  html[data-measure="wide"] { --measure: 44rem; }

  .library-lede {
    margin: 0 0 28px;
    color: var(--mute);
    font-size: 13px;
    max-width: 36rem;
  }

  .story-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0;
    border-top: 1px solid var(--hair);
  }
  .story-list li { border-bottom: 1px solid var(--hair); }
  .story-card {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 14px 18px;
    align-items: baseline;
    width: 100%;
    padding: 18px 2px;
    border: 0;
    background: transparent;
    color: inherit;
    text-align: left;
    cursor: pointer;
    font: inherit;
  }
  .story-card:hover .story-card-title,
  .story-card:focus-visible .story-card-title { color: var(--accent); }
  .story-card:focus-visible {
    outline: 1px solid var(--accent);
    outline-offset: 2px;
  }
  .story-card-index {
    font-size: 11px;
    letter-spacing: .12em;
    color: var(--mute);
    font-variant-numeric: tabular-nums;
  }
  .story-card-title {
    display: block;
    font-size: 1.05rem;
    font-weight: 500;
    letter-spacing: .04em;
    margin: 0 0 4px;
    transition: color var(--dur) var(--ease-out);
  }
  .story-card-blurb {
    display: block;
    font-size: 13px;
    line-height: 1.45;
    color: var(--mute);
    max-width: 36rem;
  }
  .story-card-meta {
    font-size: 11px;
    color: var(--mute);
    letter-spacing: .04em;
    white-space: nowrap;
  }
  .story-card-progress {
    display: block;
    margin-top: 6px;
    height: 2px;
    width: 72px;
    background: var(--hair);
    border-radius: 1px;
    overflow: hidden;
  }
  .story-card-progress > i {
    display: block;
    height: 100%;
    width: var(--pct, 0%);
    background: var(--accent);
  }

  .reader {
    max-width: var(--measure);
    margin: 0 auto;
    padding-bottom: 20vh;
  }
  .reader-toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 0 0 36px;
    min-height: 32px;
  }
  .reader-back {
    border: 0;
    background: transparent;
    color: var(--mute);
    font: inherit;
    font-size: 12px;
    letter-spacing: .06em;
    cursor: pointer;
    padding: 8px 0;
    min-height: 44px;
  }
  .reader-back:hover,
  .reader-back:focus-visible { color: var(--ink); }
  .reader-back:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
  /* Fixed reading meter — stays put; % in the toolbar scrolled away and said little. */
  .reader-meter {
    position: fixed;
    top: max(52px, calc(env(safe-area-inset-top) + 44px));
    right: max(14px, env(safe-area-inset-right));
    z-index: 170;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 7px;
    max-width: min(42vw, 11rem);
    pointer-events: none;
    font-variant-numeric: tabular-nums;
  }
  .reader-meter[hidden] { display: none !important; }
  html[data-meter="off"] .reader-meter { display: none !important; }
  .reader-meter-viz {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 18px;
    opacity: 0.9;
  }
  html[data-meter="left"] .reader-meter-viz,
  html[data-meter="words"] .reader-meter-viz { display: none; }
  .reader-meter-viz .tick {
    display: block;
    width: 3px;
    min-height: 3px;
    height: var(--h, 40%);
    border-radius: 1px;
    background: var(--hair);
    transition: background 120ms var(--ease-out), opacity 120ms var(--ease-out);
  }
  .reader-meter-viz .tick.is-done {
    background: color-mix(in srgb, var(--accent) 55%, var(--hair));
  }
  .reader-meter-viz .tick.is-now {
    background: var(--accent);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 25%, transparent);
  }
  .reader-meter-label {
    font-size: 11px;
    letter-spacing: .07em;
    color: var(--mute);
    text-align: right;
    line-height: 1.35;
  }
  .reader-meter-label b {
    font-weight: 500;
    color: var(--ink);
    letter-spacing: .04em;
  }
  html[data-meter="marks"] .reader-meter-label {
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: lowercase;
  }
  @media (max-width: 720px) {
    .reader-meter {
      top: auto;
      bottom: max(18px, calc(env(safe-area-inset-bottom) + 12px));
      right: max(12px, env(safe-area-inset-right));
    }
  }

  .reader-title {
    font-family: var(--type);
    font-size: clamp(1.6rem, 4vw, 2.1rem);
    font-weight: 500;
    letter-spacing: .08em;
    line-height: 1.2;
    margin: 0 0 10px;
  }
  .reader-epigraph {
    font-family: var(--type);
    font-size: 0.95rem;
    font-style: italic;
    color: var(--mute);
    margin: 0 0 48px;
    line-height: 1.5;
  }

  .section {
    margin: 0 0 2.4em;
  }
  .section-num {
    display: block;
    font-family: var(--ui);
    font-size: 11px;
    letter-spacing: .16em;
    color: var(--mute);
    margin: 0 0 0.85em;
    font-variant-numeric: tabular-nums;
  }
  .section p {
    font-family: var(--type);
    font-size: var(--type-size);
    line-height: var(--type-leading);
    margin: 0 0 1.15em;
    hyphens: auto;
    text-wrap: pretty;
  }
  .section p:last-child { margin-bottom: 0; }
  .section p.is-alone {
    margin-top: 1.4em;
    margin-bottom: 1.4em;
  }
  .section-heading {
    font-family: var(--ui);
    font-size: 0.72rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--mute);
    margin: 0 0 1.1em;
  }
  .section p.is-formula {
    font-family: var(--type);
    font-style: italic;
    text-align: center;
    letter-spacing: .02em;
    margin: 1.6em 0;
    color: var(--ink);
  }
  .section p.is-broadcast {
    font-family: var(--ui);
    letter-spacing: .06em;
    text-transform: uppercase;
    font-size: 0.92em;
    margin: 1.6em 0;
  }

  /* Left story jump rail */
  .story-rail {
    position: fixed;
    top: max(56px, calc(env(safe-area-inset-top) + 48px));
    left: max(10px, env(safe-area-inset-left));
    bottom: max(24px, env(safe-area-inset-bottom));
    z-index: 170;
    width: min(148px, 22vw);
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin: 0;
    padding: 0;
    list-style: none;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: none;
    pointer-events: none;
  }
  .story-rail::-webkit-scrollbar { display: none; }
  .story-rail[hidden] { display: none !important; }
  .story-rail button {
    pointer-events: auto;
    display: grid;
    grid-template-columns: 1.6em 1fr;
    gap: 8px;
    align-items: baseline;
    width: 100%;
    margin: 0;
    padding: 8px 6px;
    border: 0;
    background: transparent;
    color: var(--mute);
    text-align: left;
    cursor: pointer;
    font: inherit;
    font-size: 11px;
    letter-spacing: .04em;
    line-height: 1.35;
    opacity: 0.42;
    transition: opacity var(--dur, 220ms) var(--ease-out, ease), color var(--dur, 220ms) var(--ease-out, ease);
  }
  .story-rail button:hover,
  .story-rail button:focus-visible {
    opacity: 0.95;
    color: var(--ink);
    outline: none;
  }
  .story-rail button:focus-visible {
    outline: 1px solid var(--accent);
    outline-offset: 2px;
  }
  .story-rail button[aria-current="true"] {
    opacity: 1;
    color: var(--ink);
  }
  .story-rail .rail-index {
    font-variant-numeric: tabular-nums;
    letter-spacing: .08em;
  }
  .story-rail .rail-title {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-transform: lowercase;
  }
  @media (max-width: 900px) {
    .story-rail {
      width: auto;
      max-width: 42px;
    }
    .story-rail .rail-title { display: none; }
    .story-rail button {
      grid-template-columns: 1fr;
      justify-items: start;
      padding: 7px 4px;
    }
  }
  @media (max-width: 560px) {
    .story-rail {
      top: auto;
      bottom: max(12px, env(safe-area-inset-bottom));
      left: max(10px, env(safe-area-inset-left));
      right: auto;
      flex-direction: row;
      width: auto;
      max-width: calc(100vw - 120px);
      gap: 0;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--hair);
      border-radius: 2px;
      padding: 2px;
    }
    .story-rail button {
      padding: 8px 10px;
      opacity: 0.55;
    }
  }

  .reader-end {
    margin-top: 3em;
    padding-top: 1.5em;
    border-top: 1px solid var(--hair);
    color: var(--mute);
    font-size: 12px;
    letter-spacing: .08em;
  }

  .progress-rail {
    position: fixed;
    left: 0;
    top: 0;
    right: 0;
    height: 2px;
    z-index: 180;
    pointer-events: none;
    background: transparent;
  }
  .progress-rail > i {
    display: block;
    height: 100%;
    width: var(--pct, 0%);
    background: var(--accent);
    transition: width 80ms linear;
  }

  [hidden] { display: none !important; }

  /* Support icons — same corner set as wordcount settings */
  #settings > .inner {
    position: relative;
    --action-inset: 12px;
  }
  .support {
    position: absolute;
    top: 12px;
    right: var(--action-inset);
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0;
    padding: 0;
    pointer-events: none;
  }
  .support a,
  .support button.shuffle-looks {
    pointer-events: auto;
    color: var(--mute);
    opacity: 0.4;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    position: relative;
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
    font: inherit;
    appearance: none;
    -webkit-appearance: none;
    transition: opacity .2s cubic-bezier(0.4, 0, 0.2, 1), color .2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .support a:hover,
  .support a:focus-visible,
  .support button.shuffle-looks:hover,
  .support button.shuffle-looks:focus-visible {
    opacity: 0.85;
    color: var(--ink);
    outline: none;
  }
  .support a:focus-visible,
  .support button.shuffle-looks:focus-visible {
    outline: 1px solid var(--accent);
    outline-offset: 3px;
  }
  .support a::after,
  .support button.shuffle-looks::after {
    content: attr(data-tip);
    position: absolute;
    right: 0;
    top: calc(100% + 8px);
    padding: 5px 8px;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.01em;
    line-height: 1.3;
    color: var(--mute);
    background: var(--face);
    border: 1px solid var(--rule);
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity .18s ease, transform .18s ease;
    z-index: 4;
  }
  .support a:hover::after,
  .support a:focus-visible::after,
  .support button.shuffle-looks:hover::after,
  .support button.shuffle-looks:focus-visible::after {
    opacity: 1;
    transform: translateY(0);
  }
  .support svg {
    width: 13px;
    height: 13px;
    display: block;
  }
  #settings .fields > fieldset:first-of-type {
    padding-right: 160px;
  }
  @keyframes stories-shuffle-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  body.is-shuffling .support button.shuffle-looks svg {
    animation: stories-shuffle-spin .42s cubic-bezier(0.4, 0, 0.2, 1);
  }
  @media (prefers-reduced-motion: reduce) {
    .support a::after,
    .support button.shuffle-looks::after { transition: none; }
    body.is-shuffling .support button.shuffle-looks svg { animation: none; }
  }

  @media (max-width: 640px) {
    .story-card {
      grid-template-columns: auto 1fr;
      grid-template-rows: auto auto;
    }
    .story-card-meta {
      grid-column: 2;
      white-space: normal;
    }
  }

  @media print {
    .suite-nav, .dock, .reader-toolbar, .progress-rail, .reader-meter, .story-rail, header.masthead { display: none !important; }
    html.stories-app body.tool-app { padding: 0; background: #fff; color: #000; }
    .reader { max-width: none; padding: 0; }
  }
</style>
</head>
<body class="tool-app" data-tool="stories">
<header class="masthead">
  <div class="masthead-start">
    <h1>stories</h1>
  </div>
  <div class="actions">
    <button id="themeBtn" class="icon-btn" type="button" aria-label="theme">
      <span class="theme-orb" aria-hidden="true"></span>
    </button>
    <button id="settingsToggle" type="button" aria-expanded="false" aria-controls="settings">settings</button>
  </div>
</header>

<div class="progress-rail" id="progressRail" hidden aria-hidden="true"><i id="progressFill"></i></div>

<div class="reader-meter" id="readerMeter" hidden>
  <div class="reader-meter-viz" id="readerMeterViz" aria-hidden="true"></div>
  <span class="reader-meter-label" id="readerMeterLabel" aria-live="polite"></span>
</div>

<nav class="story-rail" id="storyRail" hidden aria-label="stories"></nav>

<main>
  <section id="library" aria-label="library">
    <p class="library-lede">Local reading. Progress stays on this device. Look settings sync with the rest of the suite.</p>
    <ol class="story-list" id="storyList"></ol>
  </section>

  <article id="reader" class="reader" hidden aria-label="reader">
    <div class="reader-toolbar">
      <button type="button" class="reader-back" id="backBtn">← library</button>
    </div>
    <h2 class="reader-title" id="readerTitle"></h2>
    <p class="reader-epigraph" id="readerEpigraph"></p>
    <div id="readerBody"></div>
    <p class="reader-end" id="readerEnd" hidden>end</p>
  </article>
</main>

<script src="/lib/suite.js?v=50"></script>
<script src="/lib/number-tool.js?v=50"></script>
<script src="/stories/content/private-speech.js"></script>
<script src="/stories/content/nagai-protocol.js"></script>
<script src="/stories/content/definitive-host.js"></script>
<script src="/stories/content/four-elements.js"></script>
<script>
(function () {
  'use strict';

  document.documentElement.classList.add('stories-app');

  if (window.IBMTools) IBMTools.mountSuiteNav('stories');

  var STORE_KEY = 'ibm.tool.stories.progress';
  var pathParts = location.pathname.replace(/\/+$/, '').split('/');
  var pathTail = pathParts[pathParts.length - 1] || '';
  if (pathTail === 'index.html') pathTail = pathParts[pathParts.length - 2] || '';
  var dedicatedId = null;
  var libraryEl = document.getElementById('library');
  var readerEl = document.getElementById('reader');
  var storyList = document.getElementById('storyList');
  var storyRail = document.getElementById('storyRail');
  var readerBody = document.getElementById('readerBody');
  var readerTitle = document.getElementById('readerTitle');
  var readerEpigraph = document.getElementById('readerEpigraph');
  var readerMeter = document.getElementById('readerMeter');
  var readerMeterViz = document.getElementById('readerMeterViz');
  var readerMeterLabel = document.getElementById('readerMeterLabel');
  var readerEnd = document.getElementById('readerEnd');
  var progressRail = document.getElementById('progressRail');
  var progressFill = document.getElementById('progressFill');
  var backBtn = document.getElementById('backBtn');
  var mastTitle = document.querySelector('header.masthead h1');

  var activeId = null;
  var saveTimer = null;
  var meterCache = null;

  var toolUI = window.IBMNumberTool && IBMNumberTool.mountSettings({
    id: 'stories',
    about: 'A quiet ereader for local stories. Theme and chrome sync with words, time, and the other instruments. Progress is stored only in this browser. The meter tracks what is left to read — switch it in settings.',
    hasViz: false,
    gestures: false,
    extra: {
      defaults: { typeSize: 'md', measure: 'narrow', typeFace: 'book', meter: 'left' },
      fieldsHtml:
        '<fieldset><legend>size</legend><div class="seg" role="radiogroup" aria-label="type size">' +
          '<label><input type="radio" name="typeSize" value="sm"><span>sm</span></label>' +
          '<label><input type="radio" name="typeSize" value="md"><span>md</span></label>' +
          '<label><input type="radio" name="typeSize" value="lg"><span>lg</span></label>' +
          '<label><input type="radio" name="typeSize" value="xl"><span>xl</span></label>' +
        '</div></fieldset>' +
        '<fieldset><legend>measure</legend><div class="seg" role="radiogroup" aria-label="line length">' +
          '<label><input type="radio" name="measure" value="narrow"><span>narrow</span></label>' +
          '<label><input type="radio" name="measure" value="medium"><span>medium</span></label>' +
          '<label><input type="radio" name="measure" value="wide"><span>wide</span></label>' +
        '</div></fieldset>' +
        '<fieldset><legend>type</legend><div class="seg" role="radiogroup" aria-label="reading face">' +
          '<label><input type="radio" name="typeFace" value="book"><span>book</span></label>' +
          '<label><input type="radio" name="typeFace" value="serif"><span>serif</span></label>' +
          '<label><input type="radio" name="typeFace" value="sans"><span>sans</span></label>' +
          '<label><input type="radio" name="typeFace" value="mono"><span>mono</span></label>' +
        '</div></fieldset>' +
        '<fieldset><legend>meter</legend><div class="seg" role="radiogroup" aria-label="reading meter">' +

      var btn = e.target.closest('button[data-id]');
      if (!btn) return;
      jumpToStory(btn.getAttribute('data-id'));
    });
  }

  backBtn.addEventListener('click', closeReader);

  window.addEventListener('scroll', function () {
    if (!activeId || readerEl.hidden) return;
    updateProgressUI(scrollProgress());
    clearTimeout(saveTimer);
    saveTimer = setTimeout(persistScroll, 200);
  }, { passive: true });

  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && activeId && !document.body.classList.contains('settings-open')) {
      closeReader();
    }
  });

  applyReadingChrome();
  renderLibrary();

  /* After catalog loads, resolve dedicated path /stories/<id>/ */
  if (pathTail && pathTail !== 'stories' && IBMStories.byId && IBMStories.byId[pathTail]) {
    dedicatedId = pathTail;
    if (backBtn) backBtn.textContent = '← library';
  }

  function openFromHash() {
    var hash = (location.hash || '').replace(/^#/, '');
    if (hash && IBMStories.byId && IBMStories.byId[hash]) {
      openStory(hash);
      return true;
    }
    return false;
  }

  window.addEventListener('hashchange', function () {
    if (dedicatedId) return;
    if (!openFromHash() && activeId) closeReader();
  });

  if (dedicatedId) {
    openStory(dedicatedId);
  } else if (!openFromHash()) {
    setView('library');
  }
})();
</script>
</body>
</html>
